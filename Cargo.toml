[workspace]
resolver = "2"
members = ["crates/chinamaxxbom-core", "crates/chinamaxxbom-cli", "crates/chinamaxxbom-gui"]
default-members = ["crates/chinamaxxbom-core", "crates/chinamaxxbom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev]
debug = 0
